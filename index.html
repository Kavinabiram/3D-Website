<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A0E0A" />

    <!-- SEO Headers -->
    <title>ChocoVerse 3D | Immersive Luxury Chocolate Metaverse</title>
    <meta name="description" content="Experience premium chocolate craft inside an immersive 3D metaverse. Design custom chocolate bars, explore mechanical tempering pipelines, and order collection boxes." />
    
    <!-- Open Graph (Facebook/LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chocoverse3d.com" />
    <meta property="og:title" content="ChocoVerse 3D | Immersive Luxury Chocolate Metaverse" />
    <meta property="og:description" content="Experience premium chocolate craft inside an immersive 3D metaverse. Design custom chocolate bars, explore mechanical tempering pipelines, and order collection boxes." />
    <meta property="og:image" content="https://chocoverse3d.com/assets/textures/og-image.jpg" />

    <!-- Twitter Meta -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChocoVerse 3D | Immersive Luxury Chocolate Metaverse" />
    <meta name="twitter:description" content="Design custom luxury chocolate bars inside a high-end WebGL interactive environment." />
    <meta name="twitter:image" content="https://chocoverse3d.com/assets/textures/og-image.jpg" />

    <!-- Structured JSON-LD Product Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "ChocoVerse Custom Gift Box",
        "image": "https://chocoverse3d.com/assets/textures/og-image.jpg",
        "description": "Customizable luxury futuristic chocolate bars infused with premium toppings.",
        "brand": {
          "@type": "Brand",
          "name": "ChocoVerse"
        },
        "offers": {
          "@type": "AggregateOffer",
          "priceCurrency": "USD",
          "lowPrice": "11.50",
          "highPrice": "25.50"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
